# A local Kubernetes for profile K: one control plane and two workers in two
# "zones", so the Cluster's one-pod-per-zone rule (the RDS Multi-AZ placement) is
# exercised. Kubernetes >= 1.35 has ImageVolume on by default (kind 0.33: 1.37).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vg-cnpg
nodes:
  - role: control-plane
    # the pooler on localhost:5443 (manifests/overlays/local-kind/pooler-nodeport.yaml)
    extraPortMappings:
      - containerPort: 30543
        hostPort: 5443
        listenAddress: "127.0.0.1"
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-a
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-b
