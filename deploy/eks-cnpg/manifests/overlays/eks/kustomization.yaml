# Profile K, production shape: EKS (Auto Mode) + CloudNativePG, equivalent to the
# production RDS instance (planning_rds/01 §2): 8 vCPU / 64 GB Graviton, gp3 440 GiB at
# 12,000 IOPS / 500 MiB/s, a synchronous standby in another zone, backups to S3.
#
# Placeholders to set per install (all marked REPLACE_ME): the ECR image references
# (pinned by digest), the S3 bucket, the IAM role for backups, the subnets the
# internal NLB may use. Nothing here has been applied to AWS yet.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - storageclass-gp3.yaml
  - nodepool.yaml
  - objectstore.yaml
  - scheduledbackup.yaml
patches:
  - path: cluster-size.yaml
  - path: cluster-eks.yaml
