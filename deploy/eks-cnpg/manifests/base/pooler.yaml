# PgBouncer in front of the primary, in session mode. Every client (the app on ECS,
# its maintenance job, operator scripts) connects HERE, not to the primary.
#
# Why: on a switchover the old primary is demoted in place, and an address that
# points at "the primary" through an NLB keeps sending new connections to it for
# ~30 s, each failing with "read-only transaction" (SQLSTATE 25006; measured on AWS
# 2026-11-08; reproduced on kind with a Service that follows the primary 30 s late:
# 27 such errors in 30 s). With the pooler, the NLB's targets are the PgBouncer pods,
# which never change role, and PgBouncer reaches the primary through the operator's
# rw Service, which follows it at once. On kind a switchover through it gave no
# read-only errors, only ~3-8 s of refused connections while the primary changed
# (the same as connecting directly).
#
# SESSION mode, deliberately: VitalGraph relies on session state. The signal
# listener holds LISTEN; SPARQL updates take pg_advisory_xact_lock; asyncpg caches
# prepared statements per connection; the executor uses SET LOCAL / set_config(...,
# true). Transaction pooling would break the first and silently mis-route the others.
#
# Pool size: in session mode each client connection holds a server connection, so
# default_pool_size must cover every app task's two pools (DB_POOL_SIZE plus
# DB_INTERNAL_POOL_SIZE) plus the maintenance job and operator scripts, under the
# role's connection limit (per overlay).
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: vitalgraph-pg-pooler-rw
spec:
  cluster: {name: vitalgraph-pg}
  instances: 2
  type: rw
  # Replace a pod, then start its successor; never surge. Each pod needs its
  # own database node (anti-affinity below) and there are two: a surge pod
  # has nowhere to go, so the node pool would launch a third database node
  # for it (kept until consolidation) or the rollout would stall. One pod
  # down at a time fits the PDB. Parameter changes are reloaded in place;
  # this matters for image, resource and operator upgrades.
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  pgbouncer:
    poolMode: session
    parameters:
      max_client_conn: "1000"
      default_pool_size: "30"
      # After one failed server login PgBouncer refuses new clients for this long.
      # The 15 s default doubled the switchover's outage on kind (17.8 s against
      # 7.8 s direct). 1 s: back to the primary as soon as there is one.
      server_login_retry: "1"
      # TLS only, end to end: without it PgBouncer's client side accepts a plain
      # connection even though the database refuses one.
      client_tls_sslmode: require
      # A client that finds the pool full fails after this many seconds instead
      # of PgBouncer's default 120 s, so a pool sized too small shows as errors.
      query_wait_timeout: "20"
      # Keepalives on PgBouncer's sockets. Several app connections only LISTEN
      # and can sit idle for hours; past the NLB's idle timeout the NLB drops the
      # flow without a word, and without probes PgBouncer holds that session's
      # server slot until the OS default notices (over 2 hours). Probing after
      # 60 s idle keeps the flow alive and finds a dead peer in ~2 minutes.
      tcp_keepalive: "1"
      tcp_keepidle: "60"
      tcp_keepintvl: "10"
      tcp_keepcnt: "6"
      # The server sees PgBouncer's address; this appends the client's to
      # application_name, so pg_stat_activity still says which task it is.
      application_name_add_host: "1"
  template:
    metadata:
      labels:
        app: vitalgraph-pg-pooler
    spec:
      # One per zone, like the instances, and never both on one node: a drain
      # or a lost node would then take every app session at once.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {cnpg.io/poolerName: vitalgraph-pg-pooler-rw}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {cnpg.io/poolerName: vitalgraph-pg-pooler-rw}
      # With no requests the pooler is the first thing evicted under memory
      # pressure on the database nodes, and each pod carries half the app's
      # sessions. Memory request = limit and small real use keep it among the
      # last evicted. CPU: PgBouncer is single-threaded and does TLS on both
      # sides; a 0.1 CPU limit throttles it in bursts and adds latency to
      # every query. 250m is reserved (PostgreSQL requests 7 of a 2xlarge's
      # ~7.9 allocatable CPUs), and it may burst to one CPU. Watch
      # throttling on the pgbouncer containers in the first load test.
      containers:
        - name: pgbouncer
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: "1", memory: 128Mi}
---
# The operator does not create a PodDisruptionBudget for a Pooler (it does for
# the instances). Keep one pooler pod through voluntary disruptions: node
# drains, Auto Mode consolidation, upgrades.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vitalgraph-pg-pooler-rw
spec:
  minAvailable: 1
  selector:
    matchLabels: {cnpg.io/poolerName: vitalgraph-pg-pooler-rw}
