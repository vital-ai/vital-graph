[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vital-graph"
version = "0.0.39"
authors = [
    {name = "Marc Hadfield", email = "marc@vital.ai"},
]
description = "VitalGraph"
readme = "README.md"
license = {text = "Apache License 2.0"}
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
keywords = ["knowledge-graph", "rdf", "sparql", "database", "semantic-web"]

# Core dependencies - minimal set for basic functionality
dependencies = [
    "vital-ai-vitalsigns>=0.1.55",
    "vital-ai-haley-kg>=0.1.24",
    "python-dotenv",
    "rdflib>=7.0.0",
    "PyLD>=2.0.0",
    "six>=1.7.0",
    "pyoxigraph>=0.4.11",
    "openai>=1.0.0",
    "minio>=7.0.0",
]

# Optional dependency groups
[project.optional-dependencies]
# Slow-building deps (native compilation / large downloads) — cached separately in Docker
heavy = [
    "vital-ai-vitalsigns>=0.1.55",
    "vital-ai-haley-kg>=0.1.24",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "sentencepiece>=0.1.99",
    "numpy>=1.24.0",
]

# Client installation - lightweight for connecting to VitalGraph servers
client = [
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "tabulate>=0.9.0",
    "click-repl>=0.3.0",
    "aiofiles>=23.0.0",
]

# Server installation - full database and API capabilities
server = [
    "vital-graph[heavy]",
    "fastapi[standard,models]>=0.104.0",
    "uvicorn",
    "SQLAlchemy[asyncio]>=2.0.23",
    "psycopg[binary,pool]>=3.1.13",
    "asyncpg>=0.29.0",
    "alembic>=1.12.0",
    "pgvector>=0.2.4",
    "aiofiles>=23.0.0",
    "Jinja2>=3.1.0",
    "starlette>=0.27.0",
    "itsdangerous>=2.1.0",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "email-validator>=2.0.0",
    "click-repl>=0.3.0",
    "tabulate>=0.9.0",
    "pytidb[models]",
    "pytidb",
    "weaviate-client>=4.19.2",
    "datasketch>=1.9.0,<2.0",
    "redis>=5.0.0",
    "rapidfuzz>=3.0.0",
    "jellyfish>=1.0.0",
    "nltk>=3.8.0",
    # VitalSigns ONNX embedding model (paraphrase-MiniLM-L3-v2, 384 dims)
    "vital-model-paraphrase-MiniLM-onnx>=0.2.1",
    # Document → Markdown conversion on upload (issue 018 item 4).
    # Licences matter here: this project ships under Apache-2.0, so the AGPL
    # (pymupdf) and GPL (html2text) options are excluded deliberately. All three
    # below are permissive — keep it that way when bumping or substituting.
    "markdownify>=0.13.0",   # MIT — HTML → Markdown
    "pdfplumber>=0.11.0",    # MIT — PDF text extraction
    "mammoth>=1.8.0",        # BSD-2 — DOCX → HTML (heading styles preserved)
    # strip_html() in kgdocument_segmentation_processor.py imports this and
    # silently falls back to a regex when it is missing; it was never declared,
    # so the fallback was always taken. Declared now so the intended path runs.
    "beautifulsoup4>=4.12.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pglast>=7.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "nltk>=3.8.0",
    "numpy>=1.24.0",
    "sentencepiece>=0.1.99",
    # Tier 1 (tests/unit) runs with `pip install -e ".[dev]"` and must be able to
    # IMPORT the modules under test, even though those tests touch no DB or model.
    # Several L0 tests reach server-side code whose module-level imports pull these
    # in transitively:
    #   tests/unit/test_auto_sync_lifecycle.py          -> vectorization.auto_sync -> asyncpg
    #   tests/unit/test_vector_index_dimension_validation.py
    #       -> endpoint.vector_indexes_endpoint -> fastapi
    #       -> auth.role_dependencies            -> fastapi.security, PyJWT
    # These are the light half of the `server` extra — deliberately NOT the whole
    # extra, which drags in torch via `heavy`, psycopg and SQLAlchemy.
    "asyncpg>=0.29.0",
    "fastapi>=0.104.0",
    "PyJWT>=2.8.0",
    #   tests/unit/test_client_retry.py -> client.vitalgraph_client -> httpx,
    #       and transitively endpoint.files_endpoint  -> aiohttp
    #                        binary.async_streaming   -> aiofiles
    # These are the light half of the `client` extra.
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.0.0",
    # Document conversion. bs4 is a MODULE-LEVEL import in
    # document.kgdocument_segmentation_processor, so four unit test modules
    # fail at COLLECTION without it — that is what broke CI, and only bs4
    # showed because collection stops there.
    #   tests/unit/test_document_converter.py
    #   tests/unit/test_kgdocument_quad_encoding.py      -> endpoint.kgdocuments_endpoint
    #   tests/unit/test_kgdocument_write_protection.py   -> endpoint.kgdocuments_endpoint
    #   tests/unit/test_segment_deletion.py              -> document.segment_deletion
    # The other three are imported lazily inside document_converter, so they do
    # not break collection — but test_document_converter EXERCISES every
    # branch, so fixing bs4 alone would just move the failure:
    #   markdownify -> HTML  (document_converter.py:109)
    #   mammoth     -> DOCX  (:123)
    #   pdfplumber  -> PDF   (:152)
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "mammoth>=1.8.0",
    "pdfplumber>=0.11.0",
]

# Testing utilities
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

# Documentation building
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]

# All features
all = [
    "vital-graph[client,server,dev,test,docs]",
]

[project.urls]
Homepage = "https://github.com/vital-ai/vital-graph"
Repository = "https://github.com/vital-ai/vital-graph"
Documentation = "https://github.com/vital-ai/vital-graph/docs"
"Bug Tracker" = "https://github.com/vital-ai/vital-graph/issues"

[project.scripts]
# Server commands (require server extras)
vitalgraphdb = "vitalgraph.cmd.vitalgraphdb_cmd:main"
vitalgraphadmin = "vitalgraph.admin_cmd.vitalgraphdb_admin_cmd:main"
vitalgraphagentregistry = "vitalgraph.agent_registry_cmd.vitalgraph_agent_registry_cmd:main"
vitalgraphentityregistry = "vitalgraph.entity_registry_cmd.vitalgraph_entity_registry_cmd:main"
vitalgraphimport = "vitalgraph.cmd.vitalgraph_import_cmd:main"
vitalgraphexport = "vitalgraph.cmd.vitalgraph_export_cmd:main"
vitalgraphsearchutil = "vitalgraph.search_cmd.vitalgraphsearchutil_cmd:main"
# Client command (available with client extras)
vitalgraph = "vitalgraph.client.cmd.vitalgraph_repl:main"

[tool.setuptools.packages.find]
include = ["vitalgraph*"]
exclude = [
    # Matches the `vitalgraph*` include glob, so it shipped — six subpackages,
    # including the DAWG harness and the W3C test corpus. Production imports it
    # ZERO times; it is an experimental pipeline plus test tooling. Shipping it
    # was also actively harmful: the installed copy shadowed the repo for any
    # script without a sys.path insert, and that copy still resolved the host
    # cluster with an empty password (issues/055).
    "vitalgraph_sparql_sql_dev*",
    "test*",
    "test_scripts*",
    "test_script_kg_impl*",
    "vitalgraph_client_test*",
    "vitalgraph_mock_client_test*",
    "vitalgraph_service_tests*",
    "vitalsigns_test_scripts*",
    "rdflib_sqlalchemy*",
    "frontend*",
    "docs*",
    "planning*",
    "debug_scripts*",
    "examples*",
    "archive_vitalgraph_old*",
    "vitalgraphdb_config*",
    "vitalgraphclient_config*",
    "vitalhome*",
    "k8s_config*",
]

[tool.setuptools.package-data]
vitalgraph = [
    "api/frontend/dist/**/*",
    "config/**/*.yaml",
    "config/**/*.yml",
    "sql/**/*.sql",
]

# Tool configurations
[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | frontend
  )/
)
'''

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "test_scripts/",
    "frontend/",
    "docs/",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "integration: Tier 3 integration tests (require PG + Jena sidecar)",
    "api: Tier 4 API end-to-end tests (require running VitalGraph server)",
    "serial: must not run under pytest-xdist - measures a shared resource (pool capacity, timing) that parallel workers change",
    "ingest_bench: a benchmark that BUILDS its own throwaway data - its cost is the data, not the plan, and the query tier does not depend on it (separate baseline)",
]

[tool.check-manifest]
# Dev/test/tooling trees intentionally excluded from the package sdist.
ignore = [
    "tests/**",
    "e2e/**",
    "docker/**",
    "docker-compose.test.yml",
    ".devin/**",
    "issues/**",
    "load_test_scripts/**",
    "PACKAGING.md",
    "vital_env.env",
]
