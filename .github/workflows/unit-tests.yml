name: Tests (Tier 1 + 2)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      # Locally-BUILT wheels must not cross runners.
      #
      # `~/.cache/pip` holds both the download cache and wheels pip COMPILED
      # from source. `hnswlib` ships as an sdist, so it is compiled here — and
      # `restore-keys` is a PREFIX match, so a wheel built on one runner is
      # restored onto another. GitHub runners differ in CPU, and the result was
      # `Fatal Python error: Illegal instruction` (exit 132) loading `hnswlib`
      # from `vital_ai_vitalsigns.collection.vector_collection_impl`.
      #
      # It surfaced on a DOCS-ONLY commit: editing pyproject.toml missed the
      # exact cache key, fell back to the prefix, and picked up an incompatible
      # prebuilt wheel. Nothing in the repo had changed.
      #
      # Dropping only `wheels/` keeps the download cache — the part that is
      # machine-independent and most of the speed.
      - name: Drop locally-built wheels from the restored cache
        run: rm -rf ~/.cache/pip/wheels

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Tier 1 unit tests
        run: |
          python -m pytest tests/unit/ -v --tb=short -q

      # The corpus is committed under tests/conformance/dawg_data/. It used to
      # be gitignored, so this step collected two tests, skipped both and passed
      # — conformance never ran here. The guard below fails if the data is
      # missing, because an empty parametrisation is reported as a SKIP.
      - name: Check the DAWG corpus is present
        run: |
          python -m pytest tests/conformance/test_dawg_corpus_present.py --tb=short -q

      - name: Run Tier 2 DAWG conformance (no infrastructure required)
        run: |
          python -m pytest \
            tests/conformance/test_dawg_pyoxigraph.py \
            tests/conformance/test_dawg_protocol.py \
            tests/conformance/test_dawg_coverage.py \
            -v --tb=short -q

      - name: Run pglast SQL validation (if available)
        run: |
          python -m pytest tests/unit/sparql_sql/test_emit_pipeline.py -v --tb=short -q
        continue-on-error: true
