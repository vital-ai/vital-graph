version: '3.8'

services:
  vitalgraph:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vitalgraph-app
    ports:
      - "${PORT:-8001}:${PORT:-8001}"
    environment:
      - APP_MODE=production
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=${PORT:-8001}
      - HOST=${HOST:-0.0.0.0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # Benchmark fixtures are not dev working data, and maintaining them
      # competes with the API for the same PostgreSQL. Dev had NO exclusion at
      # all while the test stack excluded twelve spaces, so the maintenance job
      # was running integrity, drift and ANALYZE work across every space here --
      # including multi-GB lead/graph fixtures left over from benchmarking.
      #
      # Measured 2026-09-15: cycle time climbed 92s -> 147s -> 335s -> 453s ->
      # 625s as that work accumulated, on the same database serving requests.
      #
      # The backfill task inherits this list when BACKFILL_EXCLUDE_SPACES is
      # unset, so one setting covers both.
      - VG_MAINTENANCE_EXCLUDE_SPACES=${VG_MAINTENANCE_EXCLUDE_SPACES:-sp_lead_synth_100k,sp_lead_synth_10k,sp_lead_synth,sp_lead_dup,sp_lead_depth1,sp_lead_empty,sp_lead_types,sp_sql_lead_dataset,space_lead_dataset_test,wordnet_frames,sp_graph_synth_100k,sp_graph_synth_10k,sp_graph_skew_2k,sp_graph_forms_20k,kgquery_perf,lead_test}
      - WORKERS=${WORKERS:-1}
      # Entity registry embedding model, used for BOTH vectorization and search.
      #   vitalsigns_onnx                         384 — paraphrase-MiniLM-L3-v2 (default, English, bundled)
      #   paraphrase_multilingual_minilm_l12_v2   384 — multilingual, baked into the image
      #   openai                                 1536 — text-embedding-3-small, needs OPENAI_API_KEY
      # The vector tables carry one column per model at its native width, so
      # switching needs no schema migration — unused columns are empty and free.
      # Re-vectorize the registry after switching: the new column starts empty,
      # so vector search returns nothing until it is filled.
      - VITALGRAPH_ENTITY_REGISTRY_VECTOR_PROVIDER=${VITALGRAPH_ENTITY_REGISTRY_VECTOR_PROVIDER:-vitalsigns_onnx}
      # Same choice for the agent registry, set independently: the two corpora
      # may warrant different models.
      - VITALGRAPH_AGENT_REGISTRY_VECTOR_PROVIDER=${VITALGRAPH_AGENT_REGISTRY_VECTOR_PROVIDER:-vitalsigns_onnx}
    env_file:
      - .env
    volumes:
      # Mount data directory for persistence if needed
      - vitalgraph_data:/app/data
    restart: unless-stopped
    depends_on:
      - minio
    networks:
      - vitalgraph_network

  sparql-compiler:
    build:
      context: ./vitalgraph-jena-sidecar
      dockerfile: Dockerfile
    container_name: vitalgraph-sparql-compiler
    ports:
      - "7070:7070"
    environment:
      - PORT=7070
      - MAX_INPUT_SIZE=1048576
      - REQUEST_TIMEOUT_MS=10000
    restart: unless-stopped
    networks:
      - vitalgraph_network

  minio:
    # See docker-compose.test.yml for why this is `chainguard/minio:latest` and
    # not a pinned quay.io/minio tag: MinIO withdrew its public images.
    image: chainguard/minio:latest
    container_name: vitalgraph-minio
    # Chainguard's image runs as uid 65532. The minio_data volume below predates
    # this change and is root-owned (the old official image ran as root), so a
    # nonroot server cannot write to it — MinIO exits with "file access denied"
    # and any existing dev objects become unreachable. Staying root keeps that
    # volume readable. The test stack has no volume and so needs no override.
    user: "0:0"
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      # Consumed by the healthcheck below, which cannot use curl.
      - MC_HOST_local=http://minioadmin:minioadmin@localhost:9000
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      # The old image shipped curl; this one ships mc and no HTTP client at all,
      # so a curl healthcheck would mark the container unhealthy forever.
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - vitalgraph_network


volumes:
  vitalgraph_data:
    driver: local
  minio_data:
    driver: local

networks:
  vitalgraph_network:
    driver: bridge
