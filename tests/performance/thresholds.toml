# Regression thresholds for scripts/perf_compare.py
#
# Rationale (performance_regression_tracking_plan.md R5): structural metrics are
# deterministic on a clean vg-test DB with a pinned dataset, so they get tight
# bounds and gate the build. Timing metrics are noisy on a laptop and are
# report-only at L0-L2 — they become gates only on the dedicated L3 environment.
#
# direction = "increase"  → higher is worse (buffers, rows, latency)
# direction = "decrease"  → lower is worse (throughput, speedup ratios)

[metrics.shared_buffers]
direction = "increase"
warn_pct = 5
fail_pct = 15
min_abs_delta = 16     # a couple of buffers is noise, not a regression

[metrics.shared_read]
# REPORT ONLY. `shared_read` counts pages fetched from DISK, which is a
# property of what the buffer pool happens to hold, not of the code under test.
# `shared_buffers` (hit + read) is the structural measure and does not move
# with cache state — the same plan touches the same pages either way — so
# nothing is lost by ungating this and the signal is still printed.
#
# Measured 2026-08-22: a control run of UNMODIFIED code reported 20 benches
# differing from the baseline, most of them `shared_read` 0 -> N, after
# unrelated heavy work on the same stack evicted the fixtures' pages. A gate
# that fails on that is reporting the machine's recent history, and it trained
# exactly the habit this directory exists to prevent — reading a red run as
# noise.
direction = "increase"
warn_pct = 10
fail_pct = 25
min_abs_delta = 16
report_only = true

[metrics.max_actual_rows]
direction = "increase"
warn_pct = 5
fail_pct = 15
min_abs_delta = 25     # one page

[metrics.actual_rows]
direction = "increase"
warn_pct = 5
fail_pct = 15
min_abs_delta = 25

[metrics.heap_fetches]
direction = "increase"
warn_pct = 0
fail_pct = 0          # an index that stopped covering is always a regression

[metrics.temp_written]
direction = "increase"
warn_pct = 0
fail_pct = 0          # any new spill is a regression

# Planner estimate quality — drift here precedes plan flips.
[metrics.estimated_rows]
direction = "increase"
report_only = true

# Throughput / speedup ratios: timing-based, and noisier than "moderately".
#
# MEASURED 2026-08-22, four samples of `copy_speedup` on UNCHANGED code — this
# bench calls `insert_terms_quads_executemany` and `insert_terms_quads_copy`
# directly, and `bulk_load.py` was not touched between any of them:
#
#     9.847   (2026-08-20 baseline)
#     8.806   (2026-08-22 promotion run)
#     9.235
#    11.114
#
# A spread of 8.81 to 11.11 is about +/-12% around the mean, and `e2e_speedup`
# ranged 4.89 to 6.70, wider still. At warn 10 / fail 20 the warn band sat
# INSIDE the noise, so this pair warned on nothing and would eventually have
# taught someone that a warning here means nothing — which is how a gate stops
# working. Widened to sit outside the measured spread.
#
# The occasion for measuring it: a 10.6% move was attributed in a commit
# message to sorting the stats parameter lists (issues/115), and that was
# wrong — `bulk_load` contains no `sync_stats` call and no `sorted()`, so the
# change cannot reach this bench at all. The number was noise and the story
# was invented. Recorded here because the next plausible-sounding attribution
# will be just as easy to believe.
[metrics.quads_per_sec]
direction = "decrease"
warn_pct = 10
fail_pct = 20

[metrics.copy_speedup]
direction = "decrease"
warn_pct = 20          # measured spread is ~+/-12%; warn outside it, not inside
fail_pct = 35

[metrics.e2e_speedup]
direction = "decrease"
warn_pct = 25          # ranged 4.89-6.70 on unchanged code, wider than copy
fail_pct = 40

# Load-driver throughput (load_test_scripts/load_test.py --record).
[metrics.requests_per_sec]
direction = "decrease"
warn_pct = 10
fail_pct = 20

# Any failed request under load is a regression regardless of rate.
[metrics.failures]
direction = "increase"
warn_pct = 0
fail_pct = 0

# API bench wall-clock — report-only for now.  One 120s run does not establish a
# noise floor, and gating on laptop latency produces flakes rather than signal
# (scaling_test_strategy.md §6).  Promote to a gate once a dozen runs show what
# the spread actually is.
[metrics.wall_ms]
direction = "increase"
report_only = true

# Result counts on API benches: a query that stops matching rows has regressed,
# however fast it became.  The per-bench assertions are the primary guard; this
# catches a drop that stays above the assertion's floor.
[metrics.results]
direction = "decrease"
warn_pct = 5
fail_pct = 20

[metrics.rows]
direction = "decrease"
warn_pct = 5
fail_pct = 20

# Wall-clock: context only. Never the gate at L0-L2 (strategy doc §6 anti-pattern).
[metrics.execution_ms]
direction = "increase"
report_only = true

[metrics.planning_ms]
direction = "increase"
report_only = true

[metrics.p50_ms]
direction = "increase"
report_only = true

[metrics.p95_ms]
direction = "increase"
report_only = true

[metrics.p99_ms]
direction = "increase"
report_only = true

# ---------------------------------------------------------------------------
# Per-bench overrides — for benches with known extra variance.
# Example:
#   [bench."query.fastpath.deep_offset".shared_buffers]
#   warn_pct = 15
#   fail_pct = 30
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Per-bench overrides
# ---------------------------------------------------------------------------

# BISTABLE PLAN — issues/112. This query sits on a planner cost tie between
# `Gather Merge` and a `Sort` above a `Gather`. Which side it lands on is decided
# by the sampled statistics, so it is STABLE within a statistics epoch and flips
# across one. Measured on sp_lead_synth_100k, same commit, same settings, same
# rows:
#
#     no ANALYZE between runs      333,407 / 333,407 / 333,407   stable
#     an ANALYZE between runs      174,341 / 333,407             alternating
#     execution_ms at each         184 ms  /  483 ms
#
# So an absolute buffer count here gates a coin flip, and whichever value is
# promoted makes the other side read as a ±91% regression. It cost a day of
# misattribution once already, including a bisect over every commit before anyone
# asked whether the code was involved at all.
#
# The bench's own claim is NOT this number — it asserts that cost does not DROP
# with depth, as a ratio (`min_ratio`), and that assertion is unaffected by which
# plan runs. So the ratio keeps gating and the absolute buffers become context.
#
# This is a statement about ONE query's plan, not a general relaxation:
# `shared_buffers` still gates every other bench at 5%/15%.
[bench."query.kgquery.deep_paging.monotonic"]
shared_buffers = { report_only = true }
shared_read = { report_only = true }

# ...and gate what the bench actually claims instead. `min_ratio` is the cheapest
# page divided by the one before it: below 1.0 the curve is NON-MONOTONIC, which
# is the plan changing with depth — `issues/080` measured a sorted page getting
# FASTER with depth (13.5s -> 5.6s -> 2.7s) because the planner abandoned a
# nested loop it should never have chosen. A win-shaped defect.
#
# It had no rule at all, so the drift detector said nothing about this bench
# except the coin-flip buffer count. Lower is worse, hence direction=decrease.
[metrics.min_ratio]
direction = "decrease"
warn_pct = 20
fail_pct = 40
