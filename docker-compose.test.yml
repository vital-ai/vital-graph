# docker-compose.test.yml
#
# Ephemeral test stack for UI (Playwright) and API (pytest) testing.
#
# Key differences from docker-compose.yml:
#   - Distinct project name (vg-test) to avoid image/network collisions
#     with the dev stack (vital-graph)
#   - PostgreSQL included (dev compose relies on host-local PG)
#   - No persistent volumes — every `up` starts from a clean database
#   - Non-default ports (8002, 5433, 7071) — runs alongside dev stack
#   - VG_AUTO_INIT=true triggers admin table initialization on startup
#   - Bootstrap admin credentials set via AUTH_ROOT_USERNAME/PASSWORD
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d --build --wait
#   python -m tests.shared.seed_ui_test_data
#   cd e2e && npx playwright test
#   docker compose -f docker-compose.test.yml down
#
# Running the pytest API suite (tests/api) against THIS stack
# -----------------------------------------------------------
# tests/api/conftest.py defaults to http://localhost:8001 and the project .env
# pins LOCAL_CLIENT_SERVER_URL to that same dev port. Both must be overridden or
# the suite silently runs against the DEV server on :8001 — which, if it is
# serving an older image, produces confusing failures that look like product
# bugs rather than a misdirected test run:
#
#   LOCAL_CLIENT_SERVER_URL=http://localhost:8002 \
#   VG_TEST_PG_PORT=5433 VG_TEST_PG_PASSWORD=testpass \
#     python -m pytest tests/api -q
#
# Embedding models
# ----------------
# All local embedding weights are baked into the image (see Dockerfile), so the
# stack vectorizes with no network access. That covers
# tests/api/test_paraphrase_multilingual_vector_integration.py, which creates an
# index with provider="paraphrase_multilingual_minilm_l12_v2" and needs the
# server to embed with it.
#
# Compose interpolates ${...} from the project .env, so OPENAI_API_KEY and the
# entity-registry provider below can be set there rather than exported.
#
# To run the whole stack's ENTITY REGISTRY against a different model:
#
#   VITALGRAPH_ENTITY_REGISTRY_VECTOR_PROVIDER=paraphrase_multilingual_minilm_l12_v2 \
#     docker compose -f docker-compose.test.yml up -d --build --wait
#
# The vector tables carry one column per model, so switching needs no schema
# change even when the widths differ (openai is 1536, the others 384). Switching
# does leave the new model's column empty until the registry is re-vectorized,
# so vector search returns no hits until then — including under
# docker-compose.test.persist.yml, where the old data survives.

name: vg-test

services:
  postgres:
    build:
      context: ./docker/test-pg
      dockerfile: Dockerfile
    container_name: vitalgraph-test-pg
    environment:
      POSTGRES_DB: sparql_sql_graph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpass
    ports:
      - "5433:5432"
    # No volumes — starts empty every time
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - vitalgraph_test

  vitalgraph:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vitalgraph-test-app
    ports:
      - "8002:8001"
    environment:
      - APP_MODE=production
      - PORT=8001
      - HOST=0.0.0.0
      - WORKERS=1
      # Config env vars (unprefixed — no VITALGRAPH_ENVIRONMENT needed)
      - BACKEND_TYPE=sparql_sql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=sparql_sql_graph
      - DB_USERNAME=postgres
      - DB_PASSWORD=testpass
      - SIDECAR_URL=http://sparql-compiler:7070
      # Auth
      - SECRET_KEY=test-secret-key
      - JWT_SECRET_KEY=test-jwt-secret
      - AUTH_ROOT_USERNAME=admin
      - AUTH_ROOT_PASSWORD=admin
      # Auto-init admin tables on startup (test environments only)
      - VG_AUTO_INIT=true
      # Storage
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      # Embeddings. Passed through from the host / .env so the vector, FTS and
      # semantic-search suites can actually run; without it they fail with empty
      # result sets rather than skipping. See
      # planning/planning_cleanup/openai_vector_test_and_mapping_cleanup_plan.md
      # step 4. Empty default keeps the stack startable without a key.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Entity registry embedding model, used for BOTH vectorization and search.
      # One column per model exists on the vector tables; this picks which is
      # read and written. Switching needs no migration — see the header note.
      #   vitalsigns_onnx                         384 — paraphrase-MiniLM-L3-v2 (default, bundled)
      #   paraphrase_multilingual_minilm_l12_v2   384 — multilingual, baked into the image
      #   openai                                 1536 — text-embedding-3-small, uses OPENAI_API_KEY above
      - VITALGRAPH_ENTITY_REGISTRY_VECTOR_PROVIDER=${VITALGRAPH_ENTITY_REGISTRY_VECTOR_PROVIDER:-vitalsigns_onnx}
      # Which variable holds the OpenAI key, when the provider above is `openai`.
      # Defaults to the OPENAI_API_KEY passed in just above.
      - VITALGRAPH_ENTITY_REGISTRY_OPENAI_API_KEY_ENV=${VITALGRAPH_ENTITY_REGISTRY_OPENAI_API_KEY_ENV:-OPENAI_API_KEY}
      # Agent registry — same options, set independently of the entity registry.
      - VITALGRAPH_AGENT_REGISTRY_VECTOR_PROVIDER=${VITALGRAPH_AGENT_REGISTRY_VECTOR_PROVIDER:-vitalsigns_onnx}
      - VITALGRAPH_AGENT_REGISTRY_OPENAI_API_KEY_ENV=${VITALGRAPH_AGENT_REGISTRY_OPENAI_API_KEY_ENV:-OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vitalgraph_test

  sparql-compiler:
    build:
      context: ./vitalgraph-jena-sidecar
      dockerfile: Dockerfile
    container_name: vitalgraph-test-sidecar
    ports:
      - "7071:7070"
    environment:
      - PORT=7070
    networks:
      - vitalgraph_test

  minio:
    image: minio/minio:latest
    container_name: vitalgraph-test-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    # No volumes — ephemeral storage
    networks:
      - vitalgraph_test

networks:
  vitalgraph_test:
    driver: bridge
