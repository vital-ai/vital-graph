# docker-compose.test.yml
#
# Ephemeral test stack for UI (Playwright) and API (pytest) testing.
#
# Key differences from docker-compose.yml:
#   - Distinct project name (vg-test) to avoid image/network collisions
#     with the dev stack (vital-graph)
#   - PostgreSQL included (dev compose relies on host-local PG)
#   - No persistent volumes — BUT the data lives in the postgres *container*,
#     so it survives `up --build`. Only `down` (which removes the container)
#     resets it. See Usage below and issues/035.
#   - Non-default ports (8002, 5433, 7071) — runs alongside dev stack
#   - VG_AUTO_INIT=true triggers admin table initialization on startup
#   - Bootstrap admin credentials set via AUTH_ROOT_USERNAME/PASSWORD
#
# Usage — the `down` is what gives you a clean database, NOT `--build`:
#   docker compose -f docker-compose.test.yml down
#   docker compose -f docker-compose.test.yml up -d --build --wait
#   python -m tests.shared.seed_ui_test_data
#   cd e2e && npx playwright test
#
# Skipping the `down` keeps the existing database. `up --build` only recreates
# containers whose own image or config changed, so rebuilding the app image
# leaves the postgres container — and everything in it — running. Test data then
# accumulates across builds: one local stack reached 426 registry tombstones and
# 116 orphaned tables that way. `e2e/run-tests.sh` already does the `down` for
# you (unless --no-down).
#
# Running the pytest API suite (tests/api) against THIS stack
# -----------------------------------------------------------
# tests/api/conftest.py defaults to http://localhost:8001 and the project .env
# pins LOCAL_CLIENT_SERVER_URL to that same dev port. Both must be overridden or
# the suite silently runs against the DEV server on :8001 — which, if it is
# serving an older image, produces confusing failures that look like product
# bugs rather than a misdirected test run:
#
#   LOCAL_CLIENT_SERVER_URL=http://localhost:8002 \
#   VG_TEST_PG_PORT=5433 VG_TEST_PG_PASSWORD=testpass \
#     python -m pytest tests/api -q
#
# Embedding models
# ----------------
# All local embedding weights are baked into the image (see Dockerfile), so the
# stack vectorizes with no network access. That covers
# tests/api/test_paraphrase_multilingual_vector_integration.py, which creates an
# index with provider="paraphrase_multilingual_minilm_l12_v2" and needs the
# server to embed with it.
#
# Compose interpolates ${...} from the project .env, so OPENAI_API_KEY and the
# entity-registry provider below can be set there rather than exported.
#
# To run the whole stack's ENTITY REGISTRY against a different model:
#
#   VITALGRAPH_ENTITY_REGISTRY_VECTOR_PROVIDER=paraphrase_multilingual_minilm_l12_v2 \
#     docker compose -f docker-compose.test.yml up -d --build --wait
#
# The vector tables carry one column per model, so switching needs no schema
# change even when the widths differ (openai is 1536, the others 384). Switching
# does leave the new model's column empty until the registry is re-vectorized,
# so vector search returns no hits until then — including under
# docker-compose.test.persist.yml, where the old data survives.

name: vg-test

services:
  postgres:
    build:
      context: ./docker/test-pg
      dockerfile: Dockerfile
    container_name: vitalgraph-test-pg
    environment:
      POSTGRES_DB: sparql_sql_graph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpass
    ports:
      - "5433:5432"
    # Docker gives a container 64 MB of /dev/shm, and PostgreSQL puts parallel
    # workers' shared memory there. On a fixture large enough for the planner to
    # choose a parallel plan, every such query died with
    #
    #     could not resize shared memory segment "/PostgreSQL.888087048"
    #     to 16777216 bytes: No space left on device
    #
    # so this stack could not run a parallel query AT ALL. It went unnoticed
    # because the fixtures big enough to provoke one were not loaded here; the
    # same query succeeds with max_parallel_workers_per_gather = 0.
    #
    # Turning parallelism off would have hidden it AND changed what the
    # benchmarks measure — `perf_record` stamps that setting, so a run with it
    # at 0 is not comparable to a baseline taken at 2.
    shm_size: 1gb
    # THE TUNING LIVES HERE, not in postgresql.auto.conf.
    #
    # It used to live only in auto.conf, written by ALTER SYSTEM into the
    # container's writable layer — so recreating the container silently reverted
    # shared_buffers from 16GB to PostgreSQL's 128MB default. That is `issues/081`
    # exactly: a 1GB buffer pool on a machine with 64GB sent four implementation
    # attempts chasing a query-shape explanation for a memory setting. A stack
    # whose tuning evaporates on recreate will do it again.
    #
    # Command-line `-c` beats both postgresql.conf and postgresql.auto.conf, so
    # these are what the server runs with regardless of what a previous ALTER
    # SYSTEM left behind.
    #
    # `dynamic_shared_memory_type=sysv` keeps parallel workers off /dev/shm
    # entirely (issues/102). `shm_size` above would be enough on its own for a
    # FRESH container, but the running one was fixed with sysv — because sysv
    # can be applied with a restart and shm_size cannot, and a restart preserves
    # 22GB of loaded fixtures that a recreate destroys. Setting both means the
    # running stack and a freshly created one are configured the same way, which
    # is the property that matters: a benchmark is only comparable to one taken
    # on the same configuration.
    command:
      - postgres
      - -c
      - shared_buffers=16GB
      - -c
      - effective_cache_size=48GB
      - -c
      - work_mem=64MB
      - -c
      - dynamic_shared_memory_type=sysv
    # No named volume here — but PGDATA is NOT in the container's writable
    # layer, which this comment used to claim and which is wrong in the one way
    # that matters. `postgres:18` declares VOLUME /var/lib/postgresql, so Docker
    # creates an ANONYMOUS volume and PGDATA (18/docker beneath it) lives there.
    #
    # The practical difference: recreating the container does not DELETE the
    # data, it ORPHANS it. A new anonymous volume is created and the old one
    # stays on disk, full, unreferenced, and invisible to `docker volume ls`
    # unless you look for it. That is worth knowing in both directions — a
    # recreate still costs you every loaded fixture (~22GB, about an hour to
    # reload) because the new volume is empty, but the previous one is
    # RECOVERABLE until something prunes it. See docker-compose.test.persist.yml
    # for how to reattach one.
    #
    # It also means any change to this service's volume configuration — most
    # easily by layering docker-compose.test.persist.yml onto a stack that was
    # started without it — silently SWAPS which dataset postgres serves. The
    # fixtures do not appear corrupted; they appear absent.
    #
    # Prefer `docker restart` plus ALTER SYSTEM where a setting allows it; only
    # shm_size genuinely requires the recreate. Rebuilding the APP image does
    # not touch this container at all, so scope the command to that service.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - vitalgraph_test

  vitalgraph:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vitalgraph-test-app
    ports:
      - "8002:8001"
    environment:
      - APP_MODE=production
      - PORT=8001
      - HOST=0.0.0.0
      - WORKERS=1
      # Config env vars (unprefixed — no VITALGRAPH_ENVIRONMENT needed)
      - BACKEND_TYPE=sparql_sql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=sparql_sql_graph
      - DB_USERNAME=postgres
      - DB_PASSWORD=testpass
      - SIDECAR_URL=http://sparql-compiler:7070
      # Auth
      - SECRET_KEY=test-secret-key
      - JWT_SECRET_KEY=test-jwt-secret
      - AUTH_ROOT_USERNAME=admin
      - AUTH_ROOT_PASSWORD=admin
      # Auto-init admin tables on startup (test environments only)
      - VG_AUTO_INIT=true
      # Benchmark fixtures are exempt from the maintenance job (issues/112
      # option 3). A cycle re-ANALYZEd them mid-session and a bench then read
      # +91% worse with IDENTICAL code, because the plan flipped on refreshed
      # statistics. These spaces are measured, not served, so the maintenance
      # job's job here is to leave them alone.
      #
      # This is deliberately a divergence from production, and it is set on
      # THIS stack only. A served space must keep being maintained; nothing in
      # shipped code defaults to skipping anything.
      #
      # KEEP THIS LIST IN STEP WITH `STATS_FIXTURE_PREFIXES` in
      # tests/performance/perf_record.py. They answer the same question — which
      # spaces are benchmark fixtures — and when they disagree the stamp reports
      # "the fixtures were re-ANALYZEd" for a space the exclusion never covered.
      # Found 2026-08-23: sp_lead_types and space_lead_dataset_test were stamped
      # but not excluded, so a maintenance ANALYZE of one of them produced a
      # spurious environment NOTE on a run whose actual fixtures had not moved.
      - VG_MAINTENANCE_EXCLUDE_SPACES=${VG_MAINTENANCE_EXCLUDE_SPACES:-sp_lead_synth_100k,sp_lead_synth_10k,sp_lead_dup,sp_sql_lead_dataset,wordnet_frames,sp_graph_synth_100k,sp_graph_synth_10k,sp_graph_skew_2k,sp_graph_forms_20k,sp_lead_types,space_lead_dataset_test}
      # Storage
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      # Embeddings. Passed through from the host / .env so the vector, FTS and
      # semantic-search suites can actually run; without it they fail with empty
      # result sets rather than skipping. See
      # planning/planning_cleanup/openai_vector_test_and_mapping_cleanup_plan.md
      # step 4. Empty default keeps the stack startable without a key.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Entity registry embedding model, used for BOTH vectorization and search.
      # One column per model exists on the vector tables; this picks which is
      # read and written. Switching needs no migration — see the header note.
      #   vitalsigns_onnx                         384 — paraphrase-MiniLM-L3-v2 (default, bundled)
      #   paraphrase_multilingual_minilm_l12_v2   384 — multilingual, baked into the image
      #   openai                                 1536 — text-embedding-3-small, uses OPENAI_API_KEY above
      - VITALGRAPH_ENTITY_REGISTRY_VECTOR_PROVIDER=${VITALGRAPH_ENTITY_REGISTRY_VECTOR_PROVIDER:-vitalsigns_onnx}
      # Which variable holds the OpenAI key, when the provider above is `openai`.
      # Defaults to the OPENAI_API_KEY passed in just above.
      - VITALGRAPH_ENTITY_REGISTRY_OPENAI_API_KEY_ENV=${VITALGRAPH_ENTITY_REGISTRY_OPENAI_API_KEY_ENV:-OPENAI_API_KEY}
      # Agent registry — same options, set independently of the entity registry.
      - VITALGRAPH_AGENT_REGISTRY_VECTOR_PROVIDER=${VITALGRAPH_AGENT_REGISTRY_VECTOR_PROVIDER:-vitalsigns_onnx}
      - VITALGRAPH_AGENT_REGISTRY_OPENAI_API_KEY_ENV=${VITALGRAPH_AGENT_REGISTRY_OPENAI_API_KEY_ENV:-OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vitalgraph_test

  sparql-compiler:
    build:
      context: ./vitalgraph-jena-sidecar
      dockerfile: Dockerfile
    container_name: vitalgraph-test-sidecar
    ports:
      - "7071:7070"
    environment:
      - PORT=7070
    networks:
      - vitalgraph_test

  minio:
    image: minio/minio:latest
    container_name: vitalgraph-test-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    # No volumes — ephemeral storage
    networks:
      - vitalgraph_test

networks:
  vitalgraph_test:
    driver: bridge
